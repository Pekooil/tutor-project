  # + popup and the Sprint 14/17 surfaces, plus the web axe surfaces; zero
  # violations at WCAG 2.1 A/AA (contrast disabled — jsdom, done manually).
  # ---------------------------------------------------------------------------
  a11y:
    name: a11y (axe) (Task 4)
    runs-on: ubuntu-latest
