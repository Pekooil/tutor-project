      - name: Placeholder
        run: echo "a11y job — implemented in Sprint 18 Task 4"

  # ---------------------------------------------------------------------------
  # PLACEHOLDER — filled by Task 5.
  # Will: run web/tests/rls-coverage.test.ts against a test Supabase — every
  # user-scoped table isolated between two fixture users, deny-all tables
  # (waitlist, cost_ledger) closed to any client key, telemetry_event
  # insert-only. Test Supabase creds come from Actions secrets.
  # ---------------------------------------------------------------------------
  rls-coverage:
