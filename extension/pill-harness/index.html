<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calyxa ambient pill — dev harness</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #e9e8e3;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1c1c1a;
      }
      .sheet {
        max-width: 660px;
        margin: 44px auto 220px;
        background: #fff;
        border: 1px solid #e5e3de;
        border-radius: 14px;
        padding: 44px 52px 52px;
        box-shadow: 0 8px 28px rgba(28, 40, 30, 0.07);
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b6b65;
      }
      h1 {
        margin: 4px 0 0;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .problem {
        display: flex;
        gap: 18px;
        padding: 20px 0;
        border-bottom: 1px solid #e5e3de;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 19px;
      }
      .blank {
        height: 30px;
        border-bottom: 1.5px solid #e5e3de;
        width: 70%;
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <span class="eyebrow">Algebra II · Unit 4</span>
      <h1>Factoring practice — quadratic equations</h1>
      <div class="problem"><span>1&nbsp;&nbsp;x² + 7x + 12 = 0</span></div>
      <div class="problem">
        <div style="display: flex; flex-direction: column; gap: 12px; flex: 1">
          <span>2&nbsp;&nbsp;x² − 5x + 6 = 0</span>
          <div class="blank"></div>
          <div class="blank"></div>
        </div>
      </div>
      <div class="problem"><span>3&nbsp;&nbsp;2x² − 8x = 0</span></div>
    </div>
    <div id="calyxa-root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
